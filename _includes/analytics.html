{% if page.analytics != false and site.google_analytics_id %}

<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', "{{ site.google_analytics_id }}");

  document.addEventListener('click', function(event) {
    var target = event.target.closest('a, button, [role="button"], input[type="button"], input[type="submit"]');

    if (!target) {
      return;
    }

    var text = (target.innerText || target.value || target.getAttribute('aria-label') || '').trim();
    var href = target.href || target.getAttribute('href') || '';
    var url = href ? new URL(href, window.location.href).href : '';

    gtag('event', 'site_click', {
      click_text: text.substring(0, 100),
      click_url: url,
      click_tag: target.tagName.toLowerCase(),
      outbound: url ? new URL(url).origin !== window.location.origin : false,
      page_location: window.location.href,
      transport_type: 'beacon'
    });
  });
</script>

{% endif %}
