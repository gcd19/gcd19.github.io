{%- assign asset_version = site.time | date: "%Y%m%d%H%M%S" -%}
<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    {% include seo.html %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
    <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}?v={{ asset_version }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}?v={{ asset_version }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon-16x16.png' | relative_url }}?v={{ asset_version }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}?v={{ asset_version }}">
    <link rel="preload" href="{{ '/assets/fonts/minimal/crimson-pro-normal-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/minimal/crimson-pro-italic-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/minimal/noto-serif-sc-cjk.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/minimal-home.css' | relative_url }}?v={{ asset_version }}">
    <script src="{{ '/assets/js/minimal-home.js' | relative_url }}?v={{ asset_version }}" defer></script>
  </head>
  <body class="minimal-home">
    {{ content }}
    {% include analytics.html %}
  </body>
</html>
